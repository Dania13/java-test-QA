name: CI

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: 0 9 * * *

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  testAPI:

      runs-on: ubuntu-latest
      environment: TEST
      steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-java@v5
          with:
            distribution: 'temurin'
            java-version: '22'
            cache: 'maven'
        - run: mvn clean compile
        - run: echo "LOGIN_AUTH=${{ secrets.LOGIN_AUTH }}" >> .env
        - run: echo "PASSWORD_AUTH=${{ secrets.PASSWORD_AUTH }}" >> .env
        - run: echo "BASE_URL=${{ vars.BASE_URL }}" >> .env
        - name: Тест
          run: |
            if [[ "${{ github.event_name  }}" == "schedule" ]]; then
              mvn clean test -Dgroups="regression"
            else
              mvn clean test 
            fi
        - run: mvn allure:report
        - name: Setup Pages
          uses: actions/configure-pages@v4
        - name: Upload artifact
          uses: actions/upload-pages-artifact@v3
          with:
            allure_results: target/allure-results   # Папка с сырыми данными
            gh_pages: gh-pages                      # Папка с историей
            allure_report: allure-report            # Папка для сгенерированного отчёта
            allure_history: allure-history          # Папка для обновлённой истории

        - name: Deploy report to GitHub Pages
          uses: peaceiris/actions-gh-pages@v4
          if: ${{ always() && steps.allure-report.outcome == 'success' }}
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_branch: gh-pages
            publish_dir: allure-history

  notification:
    if: always()
    needs: [ testAPI ]

    runs-on: ubuntu-latest
    steps:
      - name: Отправка уведомления в Telegram
        run: |
          if [[ "${{ needs.testAPI.result }}" == "success" ]]; then
            STATUS="✔️ Успех"
          else
            STATUS="😒 Провалилось :-("
          fi
          
          MESSAGE="${STATUS} \n Report link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"  
          
              # Экранируем для JSON: кавычки, слеши, переносы строк
          ESCAPED=$(echo "$MESSAGE" | jq -R -s '.')
          
          curl --request POST \
            --url https://api.telegram.org/bot${{ secrets.TEST_TELEGRAM_TOKEN }}/sendMessage \
            --header 'Content-Type: application/json' \
            --data "{\"chat_id\": \"${{ secrets.TEST_TELEGRAM_CHAT_ID }}\", \"text\": $ESCAPED}"