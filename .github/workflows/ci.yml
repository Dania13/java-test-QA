name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  testAPI:

      runs-on: ubuntu-latest
      environment: TEST
      steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-java@v5
          with:
            distribution: 'temurin'
            java-version: '22'
            cache: 'maven'
        - run: mvn clean compile
        - run: echo "LOGIN_AUTH=${{ secrets.LOGIN_AUTH }}" >> .env
        - run: echo "PASSWORD_AUTH=${{ secrets.PASSWORD_AUTH }}" >> .env
        - run: echo "BASE_URL=${{ vars.BASE_URL }}" >> .env
        - name: Cache Maven dependencies
          uses: actions/cache@v3
          with:
            path: ~/.m2
            key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
            restore-keys: ${{ runner.os }}-m2
        - name: TESTS
          run: |
            if [[ "${{ github.event_name  }}" == "schedule" ]]; then
              mvn clean test -Dgroups="regression"
            else
              mvn clean test 
            fi
        - name: Clean secrets from Allure results
          if: always()
          run: |
            # Компилируем
            mvn compile
            mvn exec:java -Dexec.mainClass="utils.AllureSecretsCleaner"
        - name: Load previous report history
          uses: actions/checkout@v6
          if: always()
          continue-on-error: true
          with:
            ref: gh-pages
            path: previous-report
        - name: Copy history to allure-results
          if: always()
          run: |
            if [ -d "previous-report/history" ]; then
              echo "✅ Найдена предыдущая история, копируем..."
              mkdir -p target/allure-results/history
              cp -r previous-report/history/* target/allure-results/history/
            else
              echo "⚠️ Предыдущая история не найдена, начинаем с нуля"
            fi
        - name: Generate Allure report
          if: always()
          run: mvn allure:report
        - name: Deploy report to GitHub Pages
          uses: peaceiris/actions-gh-pages@v4
          if: always()
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_branch: gh-pages
            publish_dir:  target/site/allure-maven-plugin
            keep_files: true

  notification:
    if: always()
    needs: [ testAPI ]

    runs-on: ubuntu-latest
    steps:
      - name: Отправка уведомления в Telegram
        run: |
          if [[ "${{ needs.testAPI.result }}" == "success" ]]; then
            STATUS="✔️ Успех"
          else
            STATUS="😒 Провалилось :-("
          fi
          
          MESSAGE="${STATUS} \nReport link: https://dania13.github.io/java-test-QA/"  
          
              # Экранируем для JSON: кавычки, слеши, переносы строк
          ESCAPED=$(echo "$MESSAGE" | jq -R -s '.')
          
          curl --request POST \
            --url https://api.telegram.org/bot${{ secrets.TEST_TELEGRAM_TOKEN }}/sendMessage \
            --header 'Content-Type: application/json' \
            --data "{\"chat_id\": \"${{ secrets.TEST_TELEGRAM_CHAT_ID }}\", \"text\": $ESCAPED"
