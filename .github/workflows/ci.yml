name: CI

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: 0 9 * * *

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  testAPI:

      runs-on: ubuntu-latest
      environment: TEST
      steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-java@v5
          with:
            distribution: 'temurin'
            java-version: '22'
            cache: 'maven'
        - run: mvn clean compile
        - run: echo "LOGIN_AUTH=${{ secrets.LOGIN_AUTH }}" >> .env
        - run: echo "PASSWORD_AUTH=${{ secrets.PASSWORD_AUTH }}" >> .env
        - run: echo "BASE_URL=${{ vars.BASE_URL }}" >> .env
        - run: |
            if [[ "${{ github.event_name  }}" == "schedule" ]]; then
              mvn test -Dgroups="regression"
            else
              mvn test 
            fi

  notification:
    if: always()
    needs: [ testAPI ]

    runs-on: ubuntu-latest
    steps:
      - name: Отправка уведомления в Telegram
        run: |
          if [[ "${{ needs.testAPI.result }}" == "success" ]]; then
            STATUS="✅ Успех"
          else
            STATUS="❌ Провалилось :-("
          fi
          
          MESSAGE="${STATUS}\nReport link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"  
          
          curl --request POST \
               --url https://api.telegram.org/bot${{ secrets.TEST_TELEGRAM_TOKEN }}/sendMessage \
               --header 'Content-Type: application/json' \
                --data '{ "chat_id": "${{ secrets.TEST_TELEGRAM_CHAT_ID }}", "text": "$MESSAGE" }'