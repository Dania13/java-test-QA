name: CI

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: 0 9 * * *

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  testAPI:

      runs-on: ubuntu-latest
      environment: TEST
      steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-java@v5
          with:
            distribution: 'temurin'
            java-version: '22'
            cache: 'maven'
        - run: mvn clean compile
        - run: echo "LOGIN_AUTH=${{ secrets.LOGIN_AUTH }}" >> .env
        - run: echo "PASSWORD_AUTH=${{ secrets.PASSWORD_AUTH }}" >> .env
        - run: echo "BASE_URL=${{ vars.BASE_URL }}" >> .env
        - name: Тест
          run: |
            if [[ "${{ github.event_name  }}" == "schedule" ]]; then
              mvn clean test -Dgroups="regression"
            else
              mvn clean test 
            fi
        - name: Load previous report history
          uses: actions/checkout@v6
          if: always()
          continue-on-error: true
          with:
            ref: gh-pages
            path: gh-pages
        - name: Generate Allure report via Maven
          if: always()
          run: |
            echo "=== Генерируем Allure отчёт ==="
            mvn allure:report

            echo "=== Проверяем результат ==="
            ls -la target/site/allure-maven-plugin/

            echo "=== Копируем историю из предыдущего отчёта ==="
            if [ -d "gh-pages/history" ]; then
              echo "Копируем историю из gh-pages/history"
              mkdir -p target/site/allure-maven-plugin/history
              cp -r gh-pages/history/* target/site/allure-maven-plugin/history/ || echo "Предупреждение: не удалось скопировать историю"
            else
              echo "Папка gh-pages/history не найдена, создаём новую историю"
            fi

            echo "=== Подготавливаем allure-history для деплоя ==="
            mkdir -p allure-history
            cp -r target/site/allure-maven-plugin/* allure-history/ || echo "ОШИБКА: не удалось скопировать отчёт!"

            echo "=== Проверяем allure-history ==="
            ls -la allure-history/
            if [ -f "allure-history/index.html" ]; then
              echo "✅ index.html найден, отчёт готов к публикации"
            else
              echo "❌ ОШИБКА: index.html не найден!"
              exit 1
            fi
        - name: Check allure results
          if: always()
          run: |
            ls -la target/allure-results/ || echo "No allure-results found"
        - name: Deploy report to GitHub Pages
          uses: peaceiris/actions-gh-pages@v4
          if: ${{ always() && steps.allure-report.outcome == 'success' }}
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_branch: gh-pages
            publish_dir: allure-history

  notification:
    if: always()
    needs: [ testAPI ]

    runs-on: ubuntu-latest
    steps:
      - name: Отправка уведомления в Telegram
        run: |
          if [[ "${{ needs.testAPI.result }}" == "success" ]]; then
            STATUS="✔️ Успех"
          else
            STATUS="😒 Провалилось :-("
          fi
          
          MESSAGE="${STATUS} \nReport link: https://dania13.github.io/java-test-QA/}"  
          
              # Экранируем для JSON: кавычки, слеши, переносы строк
          ESCAPED=$(echo "$MESSAGE" | jq -R -s '.')
          
          curl --request POST \
            --url https://api.telegram.org/bot${{ secrets.TEST_TELEGRAM_TOKEN }}/sendMessage \
            --header 'Content-Type: application/json' \
            --data "{\"chat_id\": \"${{ secrets.TEST_TELEGRAM_CHAT_ID }}\", \"text\": $ESCAPED"