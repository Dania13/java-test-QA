name: CI

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  testAPI:

      runs-on: ubuntu-latest
      environment: TEST
      steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-java@v5
          with:
            distribution: 'temurin'
            java-version: '22'
            cache: 'maven'
        - run: mvn clean compile
        - run: echo "LOGIN_AUTH=${{ secrets.LOGIN_AUTH }}" >> .env
        - run: echo "PASSWORD_AUTH=${{ secrets.PASSWORD_AUTH }}" >> .env
        - run: echo "BASE_URL=${{ vars.BASE_URL }}" >> .env
        - run: mvn test

  notificationFail:
    if: failure()
    needs: [ testAPI ]

    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --request POST \
               --url https://api.telegram.org/bot${{ secrets.TEST_TELEGRAM_TOKEN }}/sendMessage \
               --header 'Content-Type: application/json' \
                --data '{ "chat_id": "${{ secrets.TEST_TELEGRAM_CHAT_ID }}", "text": "Провалилось :-(\nReport link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" }'

  notificationSuccess:
    if: success()
    needs: [ testAPI ]

    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --request POST \
               --url https://api.telegram.org/bot${{ secrets.TEST_TELEGRAM_TOKEN }}/sendMessage \
               --header 'Content-Type: application/json' \
                --data '{ "chat_id": "${{ secrets.TEST_TELEGRAM_CHAT_ID }}", "text": "Успех\nReport link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" }'
